name: Enterprise CI — Test, Syntax & Container Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  python-check-and-test:
    name: Python 3.12 Syntax & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python bytecode & syntax verification
        run: |
          python -m compileall -q -x '(\.venv|\.git|__pycache__)' .

      - name: Run full pytest suite
        env:
          LLM_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify boardroom PPTX & Audit Pack generation
        run: |
          python -c "
          import io, zipfile
          from core.demo_cases import build_vw_rivian_case
          from utils.pptx_exporter import report_to_pptx_bytes
          from utils.audit_pack import build_audit_pack_zip
          r = build_vw_rivian_case()
          pptx_bytes = report_to_pptx_bytes(r)
          assert len(pptx_bytes) > 20000
          zip_bytes = build_audit_pack_zip(r, watermark_user='CI_Runner')
          with zipfile.ZipFile(io.BytesIO(zip_bytes)) as zf:
              assert len(zf.namelist()) == 8
          print('Boardroom PPTX & Audit Pack verified OK')
          "

  docker-build-validation:
    name: Multi-Stage Docker Build Validation
    runs-on: ubuntu-latest
    needs: python-check-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
